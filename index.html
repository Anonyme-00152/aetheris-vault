<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f5f5f0" />
    <script src="/theme-init.js"></script>
    <title>Aetheris — Générateur et coffre-fort de mots de passe 100 % local</title>

    <meta name="referrer" content="no-referrer" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Aetheris" />
    <meta property="og:locale" content="fr_FR" />
    <meta property="og:title" content="Aetheris — Générateur et coffre-fort de mots de passe 100 % local" />
    <meta
      property="og:description"
      content="Des mots de passe que personne ne devinera, dans un coffre chiffré qui n’existe que chez vous."
    />
    <meta property="og:image" content="/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "Aetheris",
        "applicationCategory": "SecurityApplication",
        "operatingSystem": "Tout navigateur moderne",
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "EUR" },
        "description": "Générateur de mots de passe et coffre-fort chiffré qui fonctionnent entièrement dans le navigateur.",
        "inLanguage": "fr"
      }
    </script>
  </head>

    <div id="root"></div>
    <noscript>
      <p style="padding: 2rem; font-family: system-ui">Aetheris a besoin de JavaScript : tout le chiffrement s’exécute dans votre navigateur.</p>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
